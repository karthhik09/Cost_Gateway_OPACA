# =============================================================================
# OPACA Cost-Aware Gateway  —  application.properties
# =============================================================================
# All sensitive values (API keys) are loaded from environment variables.
# Override any setting via environment variable using the ${VAR:default} syntax.
# =============================================================================

# Server
server.port=${GATEWAY_PORT:8080}
spring.application.name=opaca-cost-gateway

# Logging
logging.level.de.gtarc.opaca.costgateway=${LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%t] %logger{30} — %msg%n

# =============================================================================
# Redis
# =============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# =============================================================================
# OPACA Platform
# =============================================================================
gateway.opaca.base-url=${OPACA_BASE_URL:http://localhost:8000}
gateway.opaca.timeout-seconds=${OPACA_TIMEOUT:30}

# =============================================================================
# Token Budget
# =============================================================================
gateway.budget.default-token-budget=${DEFAULT_TOKEN_BUDGET:10000}
gateway.budget.reset-window-seconds=${BUDGET_RESET_WINDOW:3600}
gateway.budget.cost-per-1k-prompt-tokens=${COST_PER_1K_PROMPT:0.0005}
gateway.budget.cost-per-1k-completion-tokens=${COST_PER_1K_COMPLETION:0.0015}

# =============================================================================
# Tier Routing Thresholds
# =============================================================================
gateway.routing.tier2-threshold-percent=${TIER2_THRESHOLD:80}
gateway.routing.tier3-threshold-percent=${TIER3_THRESHOLD:100}

# =============================================================================
# Groq API  (Tier 2 — Economy LLM)
# =============================================================================
gateway.groq.api-key=${GROQ_API_KEY:}
gateway.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
gateway.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
gateway.groq.timeout-seconds=${GROQ_TIMEOUT:30}

# =============================================================================
# Gemini API  (Tier 3 — Fallback LLM)
# =============================================================================
gateway.gemini.api-key=${GEMINI_API_KEY:}
gateway.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gateway.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gateway.gemini.timeout-seconds=${GEMINI_TIMEOUT:30}

# =============================================================================
# Actuator / Prometheus
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.gateway_invoke_duration_seconds=true
management.metrics.distribution.percentiles.gateway_invoke_duration_seconds=0.5,0.95,0.99

# =============================================================================
# SpringDoc / Swagger UI
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.display-request-duration=true

# =============================================================================
# Novelty Feature 1 — Complexity-Aware Routing (CAR)
# =============================================================================
# Score threshold below which a task is classified as SIMPLE and fast-tracked
# to Tier 2 (Economy / Groq) regardless of budget usage level.
# Range: 0.0 (always simple) to 1.0 (never simple). Default: 0.35
gateway.routing.simple-score-cutoff=${CAR_SIMPLE_CUTOFF:0.35}

# =============================================================================
# Novelty Feature 2 — Dynamic Budget Sharing
# =============================================================================
# Initial token pool size seeded at the start of each budget window
gateway.pool.initial-tokens=${POOL_INITIAL_TOKENS:3000}
# Agents below this usage % are considered idle and may donate surplus
gateway.pool.donate-threshold-pct=${POOL_DONATE_THRESHOLD:50}
# Fraction of remaining budget donated to pool per donation event (0.0–1.0)
gateway.pool.donate-fraction=${POOL_DONATE_FRACTION:0.20}
# Maximum tokens a single agent can borrow per operation
gateway.pool.max-borrow-tokens=${POOL_MAX_BORROW:2000}

# =============================================================================
# Novelty Feature 3 — Predictive Token Costing
# =============================================================================
# Characters-per-token ratio used for prompt length estimation
gateway.predictor.chars-per-token=${PREDICTOR_CHARS_PER_TOKEN:3.5}
# Safety multiplier applied on top of the char-based estimate
gateway.predictor.safety-factor=${PREDICTOR_SAFETY_FACTOR:1.25}
# Headroom fraction: only reject if predicted > (1 - headroom) * remaining
gateway.predictor.headroom-fraction=${PREDICTOR_HEADROOM:0.10}
