apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: opaca-gateway
data:
  GATEWAY_PORT: "8080"
  LOG_LEVEL: "INFO"
  OPACA_BASE_URL: "http://opaca-platform:8000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DEFAULT_TOKEN_BUDGET: "10000"
  BUDGET_RESET_WINDOW: "3600"
  TIER2_THRESHOLD: "80"
  TIER3_THRESHOLD: "100"
  GROQ_MODEL: "openai/gpt-oss-20b"
  GEMINI_MODEL: "gemini-3.8-flash"
  COST_PER_1K_PROMPT: "0.0005"
  COST_PER_1K_COMPLETION: "0.0015"
